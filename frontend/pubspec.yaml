name: antam
description: Hệ thống Hỗ trợ Chăm sóc Người cao tuổi "An Tâm"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Database & Backend
  http: ^1.1.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Notifications
  flutter_local_notifications: ^17.0.0
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9
  
  # UI & Utilities
  intl: ^0.20.2
  image_picker: ^1.0.5
  cached_network_image: ^3.3.0
  
  # UI Libraries
  google_fonts: ^6.1.0
  flutter_screenutil: ^5.9.0
  animations: ^2.0.11
  lottie: ^3.1.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  flutter_animate: ^4.5.0
  gap: ^3.0.0
  
  # Advanced UI Components
  flutter_staggered_grid_view: ^0.7.0
  card_swiper: ^3.0.1
  smooth_page_indicator: ^1.1.0
  glassmorphism: ^3.0.0
  flutter_slidable: ^3.0.1
  
  # Phone & SMS
  url_launcher: ^6.2.2
  permission_handler: ^11.1.0
  
  # Text to Speech
  flutter_tts: ^4.0.2
  
  # Date & Time
  timezone: ^0.9.2
  
  # Background Tasks - Tạm thời comment out do lỗi tương thích
  # workmanager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/

