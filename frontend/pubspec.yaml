name: antam
description: Hệ thống Hỗ trợ Chăm sóc Người cao tuổi "An Tâm"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  provider: ^6.1.5
  
  # Database & Backend
  http: ^1.6.0
  
  # Local Storage
  shared_preferences: ^2.5.3
  
  # Notifications
  flutter_local_notifications: ^17.2.4
  # Tạm thời comment Firebase do lỗi web build
  # firebase_core: ^2.32.0
  # firebase_messaging: ^14.7.10
  
  # UI & Utilities
  intl: ^0.20.2
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1
  
  # UI Libraries
  google_fonts: ^6.3.3
  flutter_screenutil: ^5.9.3
  animations: ^2.1.1
  lottie: ^3.3.2
  shimmer: ^3.0.0
  flutter_svg: ^2.2.3
  flutter_animate: ^4.5.2
  gap: ^3.0.1
  
  # Advanced UI Components
  flutter_staggered_grid_view: ^0.7.0
  card_swiper: ^3.0.1
  smooth_page_indicator: ^1.2.1
  glassmorphism: ^3.0.0
  flutter_slidable: ^3.1.2
  
  # Phone & SMS
  url_launcher: ^6.3.2
  permission_handler: ^11.4.0
  
  # Text to Speech
  flutter_tts: ^4.2.3
  
  # Date & Time
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
